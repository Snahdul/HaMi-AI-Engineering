name: Repository ruleset policy offline tests

on:
  pull_request:
    paths:
      - 'policies/github/**'
      - 'scripts/github/**'
      - '.github/workflows/repository-ruleset-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Ruleset policy offline regression
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test PowerShell parser and fake REST transport
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('scripts/github/Sync-RepositoryRulesets.ps1', 'scripts/github/Test-RepositoryRulesets.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) { throw "PowerShell parse errors in $file" }
          }
          pwsh -NoProfile -File scripts/github/Test-RepositoryRulesets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
