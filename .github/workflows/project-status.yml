name: HaMi GitHub Project status

on:
  issues:
    types: [labeled]
  schedule:
    # Periodically reconcile PRs. Only base-branch code gets the project secret.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: "Issue or pull request in this repository"
        type: choice
        options: [issue, pull_request]
        required: true
      number:
        description: "Issue/PR number"
        type: number
        required: true
      status:
        description: "Desired project status"
        type: choice
        options: [Todo, In Progress, Review, Done]
        required: true

# No pull_request_target or pull_request trigger, and no checkout of PR code.
permissions: {}

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      (github.event.label.name == 'workflow:in-progress' ||
       github.event.label.name == 'workflow:review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HAMI_PROJECT_TOKEN }}
      PROJECT_OWNER: Snahdul
      PROJECT_NUMBER: ${{ vars.HAMI_PROJECT_NUMBER }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      INPUT_KIND: ${{ inputs.kind }}
      INPUT_NUMBER: ${{ inputs.number }}
      INPUT_STATUS: ${{ inputs.status }}
    steps:
      - name: Synchronize GitHub Project status
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing secret HAMI_PROJECT_TOKEN"; exit 1
          fi
          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing or invalid variable HAMI_PROJECT_NUMBER"; exit 1
          fi

          project="$(gh api graphql \
            -f query='query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField {
                        id name options { id name }
                      }
                    }
                  }
                }
              }
            }' \
            -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"
          project_id="$(jq -er '.data.user.projectV2.id' <<< "$project")"
          field_id="$(jq -er '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .id' <<< "$project")"

          # Read existing project entries; the built-in workflows own Auto-add/Todo.
          find_item() {
            local wanted="$1" cursor="" result entry more
            while :; do
              local args=(-f query='query($project: ID!, $after: String) {
                node(id: $project) {
                  ... on ProjectV2 {
                    items(first: 100, after: $after) {
                      nodes {
                        id
                        content {
                          ... on Issue { id }
                          ... on PullRequest { id }
                        }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                      }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' -f project="$project_id")
              if [ -n "$cursor" ]; then args+=(-f after="$cursor"); fi
              result="$(gh api graphql "${args[@]}")"
              entry="$(jq -r --arg id "$wanted" \
                '.data.node.items.nodes[] | select(.content.id == $id) |
                 [.id, (.fieldValueByName.name // "")] | @tsv' <<< "$result")"
              if [ -n "$entry" ]; then printf '%s\n' "$entry"; return 0; fi
              more="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<< "$result")"
              if [ "$more" != "true" ]; then return 1; fi
              cursor="$(jq -er '.data.node.items.pageInfo.endCursor' <<< "$result")"
            done
          }

          sync_one() {
            local node_id="$1" desired="$2" retries="$3"
            local entry="" item_id="" prior="" option="" attempt
            option="$(jq -er --arg status "$desired" \
              '.data.user.projectV2.fields.nodes[] | select(.name == "Status") |
               .options[] | select(.name == $status) | .id' <<< "$project")"

            for attempt in $(seq 1 "$retries"); do
              entry="$(find_item "$node_id" || true)"
              if [ -n "$entry" ]; then
                item_id="$(cut -f 1 <<< "$entry")"
                prior="$(cut -f 2 <<< "$entry")"
                if [ -n "$prior" ]; then break; fi
              fi
              sleep 3
            done
            if [ -z "$item_id" ] || [ -z "$prior" ]; then
              echo "::warning::Project entry/initial status not available: $node_id"
              return 1
            fi
            # Scheduled PR reconciliation must not override a human review
            # decision merely because GitHub still marks the PR as Draft.
            if [ "${4:-}" = "pr-scheduled" ]; then
              if [ "$prior" = "Done" ]; then
                echo "$node_id: already Done; leaving human/completion state unchanged"
                return 0
              fi
              if [ "$prior" = "Review" ] && [ "$desired" = "In Progress" ]; then
                echo "$node_id: keeping human Review status for a Draft PR"
                return 0
              fi
            fi
            if [ "$prior" = "$desired" ]; then
              echo "$node_id: already $desired"; return 0
            fi

            gh api graphql \
              -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' \
              -f project="$project_id" -f item="$item_id" \
              -f field="$field_id" -f option="$option" \
              --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' >/dev/null

            echo "$node_id: $prior → $desired"
            echo "**$node_id:** $prior → $desired" >> "$GITHUB_STEP_SUMMARY"
          }

          # Work against the current state to avoid stale event transitions.
          sync_issue() {
            local number="$1" retries="${2:-20}" issue labels target
            issue="$(gh api "repos/$REPOSITORY/issues/$number")"
            if [ "$(jq -r '.state' <<< "$issue")" != "open" ]; then return 0; fi
            labels="$(jq -c '[.labels[].name]' <<< "$issue")"
            if jq -e 'index("workflow:review") != null' <<< "$labels" >/dev/null; then
              target="Review"
            elif jq -e 'index("workflow:in-progress") != null' <<< "$labels" >/dev/null; then
              target="In Progress"
            else
              return 0
            fi
            sync_one "$(jq -er '.node_id' <<< "$issue")" "$target" "$retries"
          }

          case "$EVENT_NAME" in
            issues)
              sync_issue "$ISSUE_NUMBER"
              ;;
            workflow_dispatch)
              case "$INPUT_KIND" in
                issue) endpoint="issues/$INPUT_NUMBER" ;;
                pull_request) endpoint="pulls/$INPUT_NUMBER" ;;
                *) echo "::error::Invalid item type"; exit 1 ;;
              esac
              item="$(gh api "repos/$REPOSITORY/$endpoint")"
              if [ "$(jq -r '.state' <<< "$item")" != "open" ] &&
                 [ "$INPUT_STATUS" != "Done" ]; then
                echo "::error::Cannot reactivate a closed item"; exit 1
              fi
              sync_one "$(jq -er '.node_id' <<< "$item")" "$INPUT_STATUS" 20
              ;;
            schedule)
              # PRs: draft = In Progress, ready for review = Review.
              # Only PRs whose head repository is this repository are handled.
              open_prs="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" \
                --paginate --jq '.[] | [.number, .node_id, (.head.repo.full_name // "")] | @tsv')"
              while IFS=$'\t' read -r number node_id origin; do
                [ -n "$number" ] || continue
                [ "$origin" = "$REPOSITORY" ] || continue
                pr="$(gh api "repos/$REPOSITORY/pulls/$number")"
                [ "$(jq -r '.state' <<< "$pr")" = "open" ] || continue
                if [ "$(jq -r '.draft' <<< "$pr")" = "true" ]; then
                  sync_one "$node_id" "In Progress" 2 pr-scheduled || true
                else
                  sync_one "$node_id" "Review" 2 pr-scheduled || true
                fi
              done <<< "$open_prs"

              # Repair any missed issue label events as well.
              active_issues="$(gh api "repos/$REPOSITORY/issues?state=open&per_page=100" \
                --paginate --jq '
                  .[] | select(.pull_request == null) |
                  ([.labels[].name] as $labels |
                    select(($labels | index("workflow:review")) != null or
                           ($labels | index("workflow:in-progress")) != null)) |
                  .number')"
              while IFS=$'\t' read -r number; do
                [ -n "$number" ] || continue
                sync_issue "$number" 2 || true
              done <<< "$active_issues"
              ;;
            *)
              echo "::error::Unsupported event"; exit 1
              ;;
          esac
