name: HaMi GitHub Project status

on:
  pull_request_target:
    types: [opened, reopened, converted_to_draft, ready_for_review]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      kind:
        description: "Issue or pull request in this repository"
        type: choice
        options: [issue, pull_request]
        required: true
      number:
        description: "Issue/PR number"
        type: number
        required: true
      status:
        description: "Desired project status"
        type: choice
        options: [Todo, In Progress, Review, Done]
        required: true

# Project token is a GitHub Secret. This workflow runs trusted base-branch code.
# Never check out or execute any PR code in this privileged workflow.
permissions: {}

concurrency:
  group: project-status-${{ github.event.pull_request.number || github.event.issue.number || inputs.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' &&
       (github.event.label.name == 'workflow:in-progress' ||
        github.event.label.name == 'workflow:review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.HAMI_PROJECT_TOKEN }}
      PROJECT_OWNER: Snahdul
      PROJECT_NUMBER: ${{ vars.HAMI_PROJECT_NUMBER }}
      REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      PR_NODE_ID: ${{ github.event.pull_request.node_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      LABEL_NAME: ${{ github.event.label.name }}
      INPUT_KIND: ${{ inputs.kind }}
      INPUT_NUMBER: ${{ inputs.number }}
      INPUT_STATUS: ${{ inputs.status }}
    steps:
      - name: Set the GitHub Project status
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing repository secret HAMI_PROJECT_TOKEN"
            exit 1
          fi
          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Missing or invalid repository variable HAMI_PROJECT_NUMBER"
            exit 1
          fi

          case "$EVENT_NAME" in
            pull_request_target)
              content_id="$PR_NODE_ID"
              case "$EVENT_ACTION" in
                opened|reopened|converted_to_draft) status="In Progress" ;;
                ready_for_review) status="Review" ;;
                *) echo "::error::Unexpected PR event"; exit 1 ;;
              esac
              ;;
            issues)
              content_id="$ISSUE_NODE_ID"
              case "$LABEL_NAME" in
                workflow:in-progress) status="In Progress" ;;
                workflow:review) status="Review" ;;
                *) echo "::error::Unexpected label"; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              status="$INPUT_STATUS"
              case "$INPUT_KIND" in
                issue) item_path="issues/$INPUT_NUMBER" ;;
                pull_request) item_path="pulls/$INPUT_NUMBER" ;;
                *) echo "::error::Invalid item type"; exit 1 ;;
              esac
              # This repository is public. No untrusted event text is evaluated.
              content_id="$(gh api "repos/$REPOSITORY/$item_path" --jq '.node_id')"
              ;;
            *)
              echo "::error::Unexpected workflow event"; exit 1
              ;;
          esac

          test -n "$content_id" || { echo "::error::Missing GitHub node ID"; exit 1; }

          project_json="$(gh api graphql \
            -f query='
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }' \
            -f owner="$PROJECT_OWNER" -F number="$PROJECT_NUMBER")"

          project_id="$(jq -er '.data.user.projectV2.id' <<< "$project_json")"
          field_id="$(jq -er '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .id' <<< "$project_json")"
          option_id="$(jq -er --arg desired "$status" \
            '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == $desired) | .id' \
            <<< "$project_json")"

          # GitHub's built-in Auto-add / Item added rule sets Todo asynchronously.
          # Never add a project item from this job: wait for the built-in rule.
          lookup_project_item() {
            local cursor="" response match has_next
            while :; do
              local args=(-f query='
                query($project: ID!, $after: String) {
                  node(id: $project) {
                    ... on ProjectV2 {
                      items(first: 100, after: $after) {
                        nodes {
                          id
                          content {
                            ... on Issue { id }
                            ... on PullRequest { id }
                          }
                          fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                        }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }' -f project="$project_id")
              if [ -n "$cursor" ]; then args+=(-f after="$cursor"); fi
              response="$(gh api graphql "${args[@]}")"
              match="$(jq -r --arg content "$content_id" \
                '.data.node.items.nodes[] | select(.content.id == $content) |
                 [.id, (.fieldValueByName.name // "")] | @tsv' <<< "$response")"
              if [ -n "$match" ]; then
                printf '%s\n' "$match"
                return 0
              fi
              has_next="$(jq -r '.data.node.items.pageInfo.hasNextPage' <<< "$response")"
              if [ "$has_next" != "true" ]; then return 1; fi
              cursor="$(jq -er '.data.node.items.pageInfo.endCursor' <<< "$response")"
            done
          }

          item_id=""
          current_status=""
          for attempt in $(seq 1 30); do
            lookup="$(lookup_project_item || true)"
            if [ -n "$lookup" ]; then
              item_id="$(cut -f 1 <<< "$lookup")"
              current_status="$(cut -f 2 <<< "$lookup")"
              if [ -n "$current_status" ]; then break; fi
            fi
            sleep 3
          done
          if [ -z "$item_id" ] || [ -z "$current_status" ]; then
            echo "::error::Project item/initial Status not ready after 90 seconds; retry via workflow_dispatch."
            exit 1
          fi

          # Late PR/issue events must never undo a later close or merge.
          case "$EVENT_NAME" in
            pull_request_target)
              merged_or_closed="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" \
                --jq '(.merged_at != null) or (.state == "closed")')"
              if [ "$merged_or_closed" = "true" ]; then
                echo "PR already closed/merged; leaving Done to GitHub's built-in rule."
                exit 0
              fi
              ;;
            issues)
              issue_state="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '.state')"
              if [ "$issue_state" != "open" ]; then
                echo "Issue already closed; leaving Done to GitHub's built-in rule."
                exit 0
              fi
              ;;
          esac

          gh api graphql \
            -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $choice: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project
                  itemId: $item
                  fieldId: $field
                  value: { singleSelectOptionId: $choice }
                }) {
                  projectV2Item { id }
                }
              }' \
            -f project="$project_id" -f item="$item_id" \
            -f field="$field_id" -f choice="$option_id" \
            --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' > /dev/null

          echo "Project status set to: $status"
          echo "Status: **$status**" >> "$GITHUB_STEP_SUMMARY"
